<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Levi-MD — bot de WhatsApp">
  <title>Levi-MD</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08090C"/>
      <stop offset="55%" stop-color="#0B1512"/>
      <stop offset="100%" stop-color="#120A12"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#25D366" stop-opacity="0"/>
      <stop offset="45%" stop-color="#25D366" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#EE3D86" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#EE3D86" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7CFFB2"/>
      <stop offset="45%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FF8FC0"/>
    </linearGradient>
    <radialGradient id="glowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#25D366" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#25D366" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EE3D86" stop-opacity=".40"/>
      <stop offset="100%" stop-color="#EE3D86" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#25D366" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <style>
      .fade { animation: fade 1.2s ease-out both; }
      .d1 { animation-delay: .15s }
      .d2 { animation-delay: .35s }
      .d3 { animation-delay: .55s }
      @keyframes fade { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
      .sweep { animation: sweep 6s linear infinite; }
      @keyframes sweep { 0% { transform: translateX(-900px) } 100% { transform: translateX(900px) } }
      .pulse { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1) } 50% { opacity: 1; transform: scale(1.08) } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      .dot { animation: float 5s ease-in-out infinite; }
      .dot2 { animation: float 6.5s ease-in-out infinite reverse; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
      .tag { letter-spacing: 5px }
    </style>
  </defs>

  <rect width="900" height="240" fill="url(#bg)"/>
  <rect width="900" height="240" fill="url(#grid)"/>
  <ellipse cx="120" cy="40" rx="220" ry="150" fill="url(#glowG)" class="pulse"/>
  <ellipse cx="820" cy="210" rx="230" ry="150" fill="url(#glowP)" class="pulse" style="animation-delay:1.5s"/>
  <rect y="0" width="260" height="240" fill="url(#sweep)" class="sweep" opacity=".5"/>

  <g class="fade d1">
    <text x="60" y="96" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="60" font-weight="800" fill="url(#txt)" letter-spacing="-1">LEVI-MD</text>
    <rect x="392" y="56" width="6" height="42" fill="#25D366" class="cursor"/>
  </g>

  <g class="fade d2">
    <text x="62" y="132" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#9BE7C4" class="tag">BOT DE WHATSAPP · MULTI-DEVICE</text>
  </g>

  <g class="fade d3" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#C9D4CF">
    <circle cx="72" cy="176" r="5" fill="#25D366" class="pulse"/>
    <text x="88" y="181">213 comandos</text>
    <circle cx="242" cy="176" r="5" fill="#EE3D86" class="pulse" style="animation-delay:.6s"/>
    <text x="258" y="181">203/204 pruebas</text>
    <circle cx="412" cy="176" r="5" fill="#7CFFB2" class="pulse" style="animation-delay:1.2s"/>
    <text x="428" y="181">anti-ban nativo</text>
    <circle cx="586" cy="176" r="5" fill="#FF8FC0" class="pulse" style="animation-delay:1.8s"/>
    <text x="602" y="181">AGPL-3.0</text>
  </g>

  <g opacity=".75">
    <circle cx="742" cy="66" r="3.5" fill="#25D366" class="dot"/>
    <circle cx="784" cy="104" r="2.5" fill="#EE3D86" class="dot2"/>
    <circle cx="820" cy="58" r="2" fill="#7CFFB2" class="dot"/>
    <circle cx="700" cy="128" r="2" fill="#FF8FC0" class="dot2"/>
  </g>

  <rect x="0" y="236" width="900" height="4" fill="url(#sweep)" class="sweep" opacity=".9"/>
</svg>
