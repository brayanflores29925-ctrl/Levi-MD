# Levi-MD — contador del README.
# Regenera docs/assets/visitas.svg con los commits y los días en línea reales.
# No usa ningún servicio externo: por eso no puede aparecer roto en GitHub.
name: Contador

on:
  push:
    branches: [main]
  schedule:
    # una vez al día, para que el número de días avance solo
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contador
  cancel-in-progress: false

jobs:
  contar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # el contador cuenta commits y días: necesita la historia completa
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dibujar el contador
        run: node tools/contador.js

      - name: Guardar si cambió
        run: |
          if git diff --quiet -- docs/assets/visitas.svg; then
            echo "Sin cambios: el contador ya estaba al día."
            exit 0
          fi
          git config user.name "rioku"
          git config user.email "riokuroxi-svg@users.noreply.github.com"
          git add docs/assets/visitas.svg
          git commit -m "contador: actualizar commits y dias [skip ci]"
          git push
